name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional release tag (e.g. v1.0.0). Leave empty to build and upload workflow artifacts only.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build and execute automated test suite
        shell: pwsh
        run: .\scripts\build.ps1 -Configuration Release

      - name: Package portable release
        shell: pwsh
        run: |
          $rawTag = "${{ inputs.tag }}"
          if (-not $rawTag -and "${{ github.ref }}".StartsWith("refs/tags/")) {
            $rawTag = "${{ github.ref_name }}"
          }
          if ($rawTag) {
            .\scripts\package.ps1 -Version ($rawTag.TrimStart('v', 'V'))
          } else {
            .\scripts\package.ps1
          }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MixerOnline-win-x64
          path: |
            dist/*.zip
            dist/*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          prerelease: false
          files: |
            dist/*.zip
            dist/*.exe
